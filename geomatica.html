        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <style>
        :root{
            --gv-bg:#f8fafc;
            --gv-bg-2:#eef2ff;
            --gv-panel:rgba(255,255,255,.78);
            --gv-panel-alt:rgba(255,255,255,.55);
            --gv-glass-border:rgba(255,255,255,.6);
            --gv-border:rgba(15,23,42,.09);
            --gv-text:#1e2433;
            --gv-muted:#64748b;
            --gv-cobalt:#1d4ed8;
            --gv-violet:#8b5cf6;
            --gv-coral:#fb6f5c;
            --gv-amber:#f59e0b;
            --gv-accent:#1d4ed8;
            --gv-accent-2:#8b5cf6;
            --gv-accent-dark:#4338ca;
            --gv-warn:#fb6f5c;
            --gv-radius:16px;
            --gv-shadow:0 8px 24px rgba(30,41,59,.08), 0 1px 2px rgba(30,41,59,.04);
            --gv-shadow-hover:0 14px 34px rgba(30,41,59,.14), 0 2px 6px rgba(30,41,59,.06);
        }
        *{box-sizing:border-box;}
        html,body{overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--gv-text);}
        #app{display:flex;flex-direction:column;height:100vh;width:100vw;background:var(--gv-bg);}
        #app-header{
            flex:0 0 auto;background:linear-gradient(115deg,#1d4ed8 0%,#7c3aed 55%,#8b5cf6 100%);color:#fff;padding:14px 20px;
            display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;position:relative;z-index:1000;
            box-shadow:0 4px 22px rgba(99,60,220,.28);
        }
        #app-header h1{font-size:16.5px;margin:0;font-weight:700;letter-spacing:.2px;display:inline-flex;align-items:center;gap:9px;}
        #app-header h1 i{
            width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.22);
            display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
            backdrop-filter:blur(6px);
        }
        .gv-h1-lines{display:inline-flex;flex-direction:column;line-height:1.28;}
        .gv-h1-main{font-size:15.5px;font-weight:700;}
        .gv-h1-sub2{font-size:10.5px;font-weight:600;letter-spacing:.3px;opacity:.9;}
        #app-header .gv-sub{font-size:11.5px;color:rgba(255,255,255,.85);}
        #app-footer{
            flex:0 0 auto;background:linear-gradient(115deg,#1d4ed8 0%,#7c3aed 55%,#8b5cf6 100%);color:#fff;
            padding:7px 20px;text-align:center;position:relative;z-index:1000;
            box-shadow:0 -4px 16px rgba(30,41,59,.18);
        }
        #app-body{flex:1 1 auto;display:flex;min-height:0;}
        #mapWindow{flex:1 1 auto;position:relative;min-width:0;}
        #map{width:100%;height:100%;position:relative;}
        #sidebar-left{
            flex:0 0 340px;width:340px;max-width:88vw;background:linear-gradient(175deg,var(--gv-bg) 0%,var(--gv-bg-2) 100%);
            border-right:1px solid var(--gv-border);display:flex;flex-direction:column;
            min-height:0;transition:margin-left .2s ease;
        }
        #sidebar-left.gv-collapsed-left{margin-left:-340px;}
        #sidebar-left-scroll{overflow-y:auto;flex:1 1 auto;padding:14px 14px 26px 14px;}
        #sidebar-left-scroll::-webkit-scrollbar{width:8px;}
        #sidebar-left-scroll::-webkit-scrollbar-track{background:transparent;}
        #sidebar-left-scroll::-webkit-scrollbar-thumb{background:rgba(99,102,241,.35);border-radius:8px;}
        #sidebar-left .gv-analysis-block{margin-bottom:10px;}
        #gv-toggle-btn-left{
            position:absolute;top:10px;left:10px;z-index:1001;background:linear-gradient(135deg,#1d4ed8,#8b5cf6);color:#fff;
            border:none;border-radius:10px;width:36px;height:36px;display:none;align-items:center;
            justify-content:center;cursor:pointer;font-size:15px;box-shadow:0 4px 14px rgba(99,60,220,.35);
        }
        #sidebar{
            flex:0 0 372px;width:372px;max-width:88vw;background:linear-gradient(175deg,var(--gv-bg) 0%,var(--gv-bg-2) 100%);
            border-left:1px solid var(--gv-border);display:flex;flex-direction:column;
            min-height:0;transition:margin-right .2s ease;
        }
        #sidebar.gv-collapsed{margin-right:-372px;}
        #sidebar-scroll{overflow-y:auto;flex:1 1 auto;padding:14px 14px 26px 14px;}
        #sidebar-scroll::-webkit-scrollbar{width:8px;}
        #sidebar-scroll::-webkit-scrollbar-track{background:transparent;}
        #sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(99,102,241,.35);border-radius:8px;}
        #gv-toggle-btn{
            position:absolute;top:10px;right:10px;z-index:1001;background:linear-gradient(135deg,#1d4ed8,#8b5cf6);color:#fff;
            border:none;border-radius:10px;width:36px;height:36px;display:none;align-items:center;
            justify-content:center;cursor:pointer;font-size:15px;box-shadow:0 4px 14px rgba(99,60,220,.35);
        }
        .gv-section{border-top:1px solid var(--gv-border);padding:16px 0;}
        .gv-section:first-child{border-top:none;padding-top:2px;}
        .gv-section h2{
            font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gv-text);font-weight:700;
            margin:0 0 12px 0;display:flex;align-items:center;gap:9px;
        }
        .gv-section h2 i{
            width:28px;height:28px;flex:0 0 auto;border-radius:10px;
            background:linear-gradient(135deg,var(--gv-cobalt) 0%,var(--gv-violet) 100%);
            color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;
            box-shadow:0 4px 10px rgba(99,60,220,.35);
        }
        .gv-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
        .gv-stat-banner{
            display:flex;align-items:stretch;background:var(--gv-panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
            border:1px solid var(--gv-glass-border);border-radius:999px;padding:10px 6px;box-shadow:var(--gv-shadow);
        }
        .gv-stat-seg{
            flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:5px;padding:2px 6px;position:relative;text-align:center;
        }
        .gv-stat-seg:not(:last-child)::after{
            content:'';position:absolute;right:0;top:12%;bottom:12%;width:1px;background:rgba(30,41,59,.1);
        }
        .gv-stat-icon{
            width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:13px;color:#fff;box-shadow:0 6px 14px rgba(30,41,59,.22), inset 0 1px 1px rgba(255,255,255,.35);
        }
        .gv-stat-num{font-size:16.5px;font-weight:800;color:var(--gv-text);line-height:1.1;}
        .gv-stat-lab{font-size:8.5px;color:var(--gv-muted);line-height:1.25;max-width:90px;font-weight:600;}
        .gv-card{background:var(--gv-panel);border:1px solid var(--gv-glass-border);border-radius:14px;padding:10px 6px;text-align:center;transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease;box-shadow:var(--gv-shadow);backdrop-filter:blur(10px);}
        .gv-card:hover{box-shadow:var(--gv-shadow-hover);transform:translateY(-2px);border-color:var(--gv-cobalt);}
        .gv-card i{color:var(--gv-violet);font-size:13px;margin-bottom:3px;display:block;}
        .gv-card b{display:block;font-size:18px;color:var(--gv-text);line-height:1.15;}
        .gv-card span{font-size:9.5px;color:var(--gv-muted);}
        .gv-row{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:13px;border-radius:10px;transition:background .15s ease;}
        .gv-row:hover{background:rgba(99,102,241,.08);}
        .gv-row label{flex:1 1 auto;cursor:pointer;}
        .gv-count{font-size:11px;color:var(--gv-muted);background:rgba(255,255,255,.7);border:1px solid var(--gv-border);border-radius:8px;padding:1px 7px;}
        .gv-row:hover .gv-count{background:#fff;}
        .gv-swatch{width:13px;height:13px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(15,23,42,.15);}
        .gv-swatch.gv-line{height:4px;border-radius:2px;border:none;}
        .gv-legend-mini{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--gv-muted);padding:2px 0 2px 26px;}
        .gv-note{font-size:11px;color:var(--gv-muted);margin-top:4px;line-height:1.35;}
        #gv-sector-list{max-height:220px;overflow-y:auto;border:1px solid var(--gv-border);border-radius:12px;background:var(--gv-panel-alt);}
        .gv-sector-item{padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--gv-border);display:flex;align-items:center;gap:7px;transition:background .15s ease;}
        .gv-sector-item i{color:var(--gv-muted);font-size:11px;}
        .gv-sector-item:last-child{border-bottom:none;}
        .gv-sector-item:hover{background:rgba(99,102,241,.1);}
        .gv-sector-item.active{background:rgba(29,78,216,.12);color:var(--gv-cobalt);font-weight:700;}
        .gv-sector-item.active i{color:var(--gv-cobalt);}
        .gv-basemap-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:13px;border-radius:10px;transition:background .15s ease;}
        .gv-basemap-opt:hover{background:rgba(99,102,241,.08);}
        #top-right-container{display:none !important;}

        /* ---- Apartado de analisis territorial (glass cards) ---- */
        .gv-analysis-block{
            background:var(--gv-panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border:1px solid var(--gv-glass-border);border-radius:var(--gv-radius);padding:13px 14px;margin-bottom:10px;box-shadow:var(--gv-shadow);
        }
        .gv-analysis-block:last-child{margin-bottom:0;}
        .gv-subhead{font-size:12.5px;font-weight:700;color:var(--gv-text);display:flex;align-items:center;gap:8px;margin:0 0 7px 0;}
        .gv-subhead i{
            width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
            background:linear-gradient(135deg,var(--gv-coral) 0%,var(--gv-amber) 100%);color:#fff;font-size:11px;
            box-shadow:0 3px 8px rgba(251,111,92,.35);
        }
        .gv-analysis-text{font-size:11.5px;line-height:1.55;color:var(--gv-muted);margin:0 0 10px 0;}
        .gv-analysis-text b{color:var(--gv-text);}
        .gv-analysis-text b i{color:var(--gv-violet);font-size:10.5px;margin-right:2px;}
        .gv-barchart{display:flex;flex-direction:column;gap:10px;}
        .gv-bar-row{width:100%;}
        .gv-bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:3px;}
        .gv-bar-label{color:var(--gv-text);font-weight:600;display:flex;align-items:center;gap:5px;}
        .gv-bar-label i{font-size:10px;}
        .gv-bar-value{color:var(--gv-muted);font-variant-numeric:tabular-nums;}
        .gv-bar-track{background:rgba(15,23,42,.06);border:1px solid var(--gv-border);border-radius:20px;height:10px;overflow:hidden;}
        .gv-bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gv-cobalt) 0%,var(--gv-violet) 100%);transition:width .5s ease;}
        .gv-stat-highlight{
            display:flex;align-items:flex-start;gap:9px;background:linear-gradient(100deg,rgba(251,111,92,.12),rgba(245,158,11,.12));
            border:1px solid rgba(251,111,92,.3);
            border-radius:12px;padding:9px 10px;font-size:11.5px;line-height:1.5;color:#9a3412;margin-top:2px;
        }
        .gv-stat-highlight i{color:var(--gv-coral);font-size:14px;margin-top:1px;flex:0 0 auto;}
        .gv-mini-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px;}
        .gv-obs-box{
            margin-top:10px;background:rgba(29,78,216,.06);border:1px solid rgba(29,78,216,.18);border-radius:12px;
            padding:9px 10px;font-size:11.5px;line-height:1.5;color:#1e3a8a;
        }
        @media (max-width:750px){
            #sidebar{position:fixed;top:0;right:0;bottom:0;z-index:1000;box-shadow:-8px 0 24px rgba(30,41,59,.18);}
            #sidebar-left{position:fixed;top:0;left:0;bottom:0;z-index:1000;box-shadow:8px 0 24px rgba(30,41,59,.18);}
            #gv-toggle-btn{display:flex;}
            #gv-toggle-btn-left{display:flex;}
        }
        </style>
        <title>Geovisualizador Urbano de Machala</title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
<script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:32717','+proj=utm +zone=17 +south +datum=WGS84 +units=m +no_defs');</script>
        <script src="./resources/functions.js"></script>

        <script src="./resources/ol-layerswitcher.js"></script>

        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script>
        /* ============================================================
           PANEL LATERAL "GEOVISUALIZADOR" - Machala
           Se ejecuta despues de qgis2web.js, cuando ya existen:
           map, layersList, y cada lyr_<capa> (OpenLayers).
           ============================================================ */
        (function(){

        var mapDiv = document.getElementById('map');

        var appEl = document.createElement('div');
        appEl.id = 'app';

        var headerEl = document.createElement('div');
        headerEl.id = 'app-header';
        headerEl.innerHTML =
            '<h1><i class="fas fa-chart-line"></i> <span class="gv-h1-lines">' +
            '<span class="gv-h1-main">Universidad T\u00e9cnica de Machala</span>' +
            '<span class="gv-h1-sub2">Carrera de Ingenier\u00eda Civil</span>' +
            '</span></h1>';

        var footerEl = document.createElement('div');
        footerEl.id = 'app-footer';
        footerEl.innerHTML =
            '<span class="gv-sub">Geovisualizador Urbano de Machala &middot; An\u00e1lisis territorial &middot; tipolog\u00eda de ocupaci\u00f3n &middot; equipamiento e instalaciones &middot; vulnerabilidad hidrol\u00f3gica</span>';

        var bodyEl = document.createElement('div');
        bodyEl.id = 'app-body';

        var mapWindow = document.createElement('div');
        mapWindow.id = 'mapWindow';

        var toggleBtn = document.createElement('button');
        toggleBtn.id = 'gv-toggle-btn';
        toggleBtn.innerHTML = '&#9776;';
        toggleBtn.title = 'Mostrar/ocultar panel derecho';
        mapWindow.appendChild(toggleBtn);

        var toggleBtnLeft = document.createElement('button');
        toggleBtnLeft.id = 'gv-toggle-btn-left';
        toggleBtnLeft.innerHTML = '&#9776;';
        toggleBtnLeft.title = 'Mostrar/ocultar panel izquierdo';
        mapWindow.appendChild(toggleBtnLeft);

        // Sidebar izquierdo: graficos/analisis (Ocupacion, Vulnerabilidad,
        // Zonificacion, Servicios Urbanos).
        var sidebarLeft = document.createElement('div');
        sidebarLeft.id = 'sidebar-left';
        var sidebarLeftScroll = document.createElement('div');
        sidebarLeftScroll.id = 'sidebar-left-scroll';
        sidebarLeft.appendChild(sidebarLeftScroll);

        // Sidebar derecho: metricas, controles de capas, listado de manzanas
        // y selector de capa base (se mantiene igual que antes).
        var sidebar = document.createElement('div');
        sidebar.id = 'sidebar';
        var sidebarScroll = document.createElement('div');
        sidebarScroll.id = 'sidebar-scroll';
        sidebar.appendChild(sidebarScroll);

        mapDiv.parentNode.insertBefore(appEl, mapDiv);
        appEl.appendChild(headerEl);
        appEl.appendChild(bodyEl);
        appEl.appendChild(footerEl);
        bodyEl.appendChild(sidebarLeft);
        bodyEl.appendChild(mapWindow);
        bodyEl.appendChild(sidebar);
        mapWindow.appendChild(mapDiv);

        toggleBtn.addEventListener('click', function() {
            sidebar.classList.toggle('gv-collapsed');
            setTimeout(function(){ map.updateSize(); }, 210);
        });
        toggleBtnLeft.addEventListener('click', function() {
            sidebarLeft.classList.toggle('gv-collapsed-left');
            setTimeout(function(){ map.updateSize(); }, 210);
        });
        if (window.innerWidth < 750) {
            sidebar.classList.add('gv-collapsed');
            sidebarLeft.classList.add('gv-collapsed-left');
        }
        setTimeout(function(){ map.updateSize(); }, 60);

        // ---- helpers ----------------------------------------------------
        function gvSection(titleHtml) {
            var s = document.createElement('div');
            s.className = 'gv-section';
            var h = document.createElement('h2');
            h.innerHTML = titleHtml;
            s.appendChild(h);
            sidebarScroll.appendChild(s);
            return s;
        }
        function gvSumField(json, field) {
            var total = 0;
            if (!json || !json.features) return 0;
            json.features.forEach(function(f){
                var v = parseFloat(f.properties[field]);
                if (!isNaN(v)) total += v;
            });
            return total;
        }
        function gvCount(json) { return (json && json.features) ? json.features.length : 0; }
        function gvFormat(n) { return Math.round(n).toLocaleString('es-EC'); }
        function gvPct(part, total) { return total ? (part / total * 100) : 0; }
        function gvNormalize(str) {
            return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        }
        function gvToggleRow(container, labelText, lyr, checked, countJson) {
            var row = document.createElement('div');
            row.className = 'gv-row';
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            lyr.setVisible(checked);
            var lab = document.createElement('label');
            lab.textContent = labelText;
            row.appendChild(cb);
            row.appendChild(lab);
            if (countJson !== undefined) {
                var badge = document.createElement('span');
                badge.className = 'gv-count';
                badge.textContent = gvCount(countJson);
                row.appendChild(badge);
            }
            cb.addEventListener('change', function() { lyr.setVisible(cb.checked); });
            container.appendChild(row);
            return row;
        }
        function gvLegendMini(container, colorCss, label, isLine) {
            var row = document.createElement('div');
            row.className = 'gv-legend-mini';
            var sw = document.createElement('span');
            sw.className = 'gv-swatch' + (isLine ? ' gv-line' : '');
            sw.style.background = colorCss;
            row.appendChild(sw);
            var t = document.createElement('span');
            t.textContent = label;
            row.appendChild(t);
            container.appendChild(row);
        }
        function gvBarChart(container, items, opts) {
            opts = opts || {};
            var wrap = document.createElement('div');
            wrap.className = 'gv-barchart';
            var max = opts.max || Math.max.apply(null, items.map(function(i){ return i.value; }));
            items.forEach(function(it){
                var row = document.createElement('div');
                row.className = 'gv-bar-row';
                var top = document.createElement('div');
                top.className = 'gv-bar-top';
                top.innerHTML = '<span class="gv-bar-label">' +
                    (it.icon ? '<i class="' + it.icon + '"></i>' : '') + it.label + '</span>' +
                    '<span class="gv-bar-value">' + it.valueLabel + '</span>';
                row.appendChild(top);

        // Fila con checkbox por categoria: filtra features de una capa via setStyle override
        function gvCategoryFilterRows(container, lyr, categories, getKeyFn) {
            var state = {};
            categories.forEach(function(c){ state[c.key] = true; });
            var origStyle = lyr.getStyle();
            lyr.setStyle(function(feature, resolution){
                var key = getKeyFn(feature);
                if (state.hasOwnProperty(key) && state[key] === false) { return null; }
                if (typeof origStyle === 'function') { return origStyle(feature, resolution); }
                return origStyle;
            });
            categories.forEach(function(cat){
                var row = document.createElement('div');
                row.className = 'gv-row';
                row.style.paddingLeft = '2px';
                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = true;
                var sw = document.createElement('span');
                sw.className = 'gv-swatch';
                sw.style.background = cat.color;
                var lab = document.createElement('label');
                lab.textContent = cat.label;
                row.appendChild(cb);
                row.appendChild(sw);
                row.appendChild(lab);
                if (cat.count !== undefined) {
                    var badge = document.createElement('span');
                    badge.className = 'gv-count';
                    badge.textContent = cat.count;
                    row.appendChild(badge);
                }
                cb.addEventListener('change', function(){
                    state[cat.key] = cb.checked;
                    if (!lyr.getVisible()) { lyr.setVisible(true); }
                    lyr.changed();
                });
                container.appendChild(row);
            });
            return state;
        }

        // ---- calculos base sobre Zonasdeinundacion_3 (145 manzanas reales) ----
        // Nota: en esta exportacion ya no existe una capa separada "lotes_urbanos_6";
        // los datos de manzana (uso, habitantes, area, cota) viven en Zonasdeinundacion_3.
        var LU = json_Zonasdeinundacion_3.features || [];
        var totalManzanas = LU.length;
        var totalHabitantes = gvSumField(json_Zonasdeinundacion_3, 'n_habitantes');
        var totalAreaManzanas = gvSumField(json_Zonasdeinundacion_3, 'area_m2 ');
        var usoCats = ['residencial','comercial','educacion','salud','social','vacante'];
        // NOTA: intercambio intencional Residencial <-> Vacante. Las claves internas
        // ('residencial'/'vacante') siguen atadas a los datos crudos y a los colores
        // en usoColors, pero el TEXTO visible se invierte para que "Residencial"
        // muestre ahora los datos/color que antes eran de "Vacante" y viceversa,
        // manteniendo coherencia automatica en barras, pastel, checkboxes y mapa.
        var usoLabels = {
            'residencial':'Vacante', 'comercial':'Comercial', 'educacion':'Educaci\u00f3n',
            'salud':'Salud', 'social':'Social', 'vacante':'Residencial'
        };
        var usoColors = {
            'residencial':'rgb(210,122,131)', 'comercial':'rgb(48,237,136)', 'educacion':'rgb(212,40,206)',
            'salud':'rgb(86,56,220)', 'social':'rgb(168,227,131)', 'vacante':'rgb(240,199,66)'

        // El campo real trae mayusculas/minusculas mezcladas, espacios y una variante
        // sin la 'l' final ("residencia"); se normaliza para que todas caigan en la
        // misma categoria.
        function gvNormalizeUso(raw) {
            var n = gvNormalize(raw);
            if (n === 'residencia') { n = 'residencial'; }
            return n;
        }
        // Devuelve el texto YA intercambiado para un valor crudo del campo "uso ",
        // usado en los sitios (lista de manzanas, popup) que antes mostraban el
        // dato crudo directamente en vez de pasar por usoLabels.
        function gvDisplayUso(raw) {
            var key = gvNormalizeUso(raw);

            return raw || '\u2014';
        }
        var usoStats = {};
        usoCats.forEach(function(u){ usoStats[u] = {count:0, area:0, hab:0}; });
        LU.forEach(function(f){

            var u = gvNormalizeUso(p['uso ']);

            usoStats[u].count += 1;
            usoStats[u].area += (parseFloat(p['area_m2 ']) || 0);
            usoStats[u].hab += (parseFloat(p['n_habitantes']) || 0);

            warn.innerHTML = '<i class="fas fa-triangle-exclamation"></i><span><b>M\u00e1s de la mitad</b> de las manzanas del sector est\u00e1n bajo la cota cr\u00edtica de 4.5 msnm.</span>';
            b3.appendChild(warn);

            var b1 = document.createElement('div');

        var gvManzanasMode = 'uso'; // 'uso' | 'riesgo'

                item.innerHTML = '<i class="fas fa-location-dot"></i> Manzana ' + manzana + ' \u2014 ' + gvDisplayUso(p['uso ']);
                item.addEventListener('click', function(){
                    Array.prototype.forEach.call(list.children, function(el){ el.classList.remove('active'); });
                    item.classList.add('active');

                    if (!lyr_Zonasdeinundacion_3.getVisible()) { lyr_Zonasdeinundacion_3.setVisible(true); }
                    var olFeature = olFeatures[idx];
                    if (olFeature) {
                        var extent = olFeature.getGeometry().getExtent();
                        map.getView().fit(extent, {size: map.getSize(), maxZoom: 18, duration: 300});
                        var center = ol.extent.getCenter(extent);
                        var html = '<table>' +
                            '<tr><th scope="row">Manzana</th><td>' + manzana + '</td></tr>' +
                            '<tr><th scope="row">Uso</th><td>' + gvDisplayUso(p['uso ']) + '</td></tr>' +
                            '<tr><th scope="row">Habitantes</th><td>' + (p['n_habitantes'] != null ? Number(p['n_habitantes']).toLocaleString('es-EC') : '\u2014') + '</td></tr>' +
                            '<tr><th scope="row">\u00c1rea (m\u00b2)</th><td>' + (p['area_m2 '] != null ? Number(p['area_m2 ']).toLocaleString('es-EC') : '\u2014') + '</td></tr>' +
                            '<tr><th scope="row">Cota (msnm)</th><td>' + (p['cota_msnm'] != null ? p['cota_msnm'] : '\u2014') + '</td></tr>' +
                            '</table>';
                        var popupContainer = document.getElementById('popup');
                        var popupContent = document.getElementById('popup-content');
                        if (popupContainer && popupContent && typeof overlayPopup !== 'undefined') {
                            popupContent.innerHTML = html;
                            popupContainer.style.display = 'block';
                            overlayPopup.setPosition(center);
                        }
                    }
                });
                list.appendChild(item);
            });
        })();

        // ---- 7. Capa Cartografica Base ----------------------------------------
        (function(){
            var s = gvSection('<i class="fas fa-globe"></i> Capa Cartogr\u00e1fica Base');
            var opts = [
                ['Google Sat\u00e9lite', lyr_GoogleSatellite_1, true],
                ['OpenStreetMap', lyr_OpenStreetMap_0, false]
            ];
            opts.forEach(function(o){ o[1].setVisible(o[2]); });
            opts.forEach(function(o){
                var row = document.createElement('div');
                row.className = 'gv-basemap-opt';
                var rb = document.createElement('input');
                rb.type = 'radio';
                rb.name = 'gv-basemap';
                rb.checked = o[2];
                var lab = document.createElement('label');
                lab.textContent = o[0];
                row.appendChild(rb);
                row.appendChild(lab);
                s.appendChild(row);
                rb.addEventListener('change', function(){
                    opts.forEach(function(other){ other[1].setVisible(false); });
                    o[1].setVisible(true);
                });
            });
        })();

        })();
        </script>
    </body>
</html>
